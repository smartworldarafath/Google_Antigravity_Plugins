<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle with Safe 10% Margin (Radius 50 inside 128x128 box) -->
  <circle cx="64" cy="64" r="50" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Planetary / Network Orbit Rings -->
  <ellipse cx="64" cy="64" rx="38" ry="16" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4,3" opacity="0.8" transform="rotate(-25 64 64)" />
  <ellipse cx="64" cy="64" rx="38" ry="16" fill="none" stroke="#818cf8" stroke-width="1.8" opacity="0.6" transform="rotate(35 64 64)" />

  <!-- Central Hub Node (Travel Concierge) -->
  <circle cx="64" cy="64" r="10" fill="#ffffff" filter="url(#glow)" />
  <circle cx="64" cy="64" r="6" fill="#0284c7" />

  <!-- Peripheral Federated Specialist Nodes -->
  <!-- Hotel Node (Top Left) -->
  <line x1="64" y1="64" x2="38" y2="40" stroke="#38bdf8" stroke-width="2" />
  <circle cx="38" cy="40" r="6.5" fill="#38bdf8" />
  <circle cx="38" cy="40" r="3" fill="#ffffff" />

  <!-- Mobility Fleet Node (Top Right) -->
  <line x1="64" y1="64" x2="90" y2="44" stroke="#818cf8" stroke-width="2" />
  <circle cx="90" cy="44" r="6.5" fill="#818cf8" />
  <circle cx="90" cy="44" r="3" fill="#ffffff" />

  <!-- Experience Passes Node (Bottom Center) -->
  <line x1="64" y1="64" x2="64" y2="92" stroke="#38bdf8" stroke-width="2" />
  <circle cx="64" cy="92" r="6.5" fill="#38bdf8" />
  <circle cx="64" cy="92" r="3" fill="#ffffff" />

  <!-- Agent Sparkles / Signal Beacons -->
  <circle cx="44" cy="80" r="2.5" fill="#38bdf8" opacity="0.9" />
  <circle cx="84" cy="78" r="2.5" fill="#818cf8" opacity="0.9" />
</svg>
